name: Build WEL Windows Client

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts
      - name: Test Electron helpers
        run: npm run test:electron
      - name: Build frontend
        run: npm run build
      - name: Check release runtime
        shell: pwsh
        run: |
          $missing = @()
          if (-not (Test-Path 'build/OpenVPN-2.5.10-I601-amd64.msi')) { $missing += 'build/OpenVPN-2.5.10-I601-amd64.msi' }
          if (-not (Test-Path 'resources/openvpn/ca.crt')) { $missing += 'resources/openvpn/ca.crt' }
          if ($missing.Count -gt 0) {
            throw "缺少安装包运行时文件，无法生成 Windows 安装包: $($missing -join ', ')"
          }
      - name: Build NSIS installer
        run: npx electron-builder --win nsis
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: wel-windows-win7-nsis
          path: frontend/release/WEL职业联盟对战平台-*-安装包.exe
          if-no-files-found: error
