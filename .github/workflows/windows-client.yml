name: Build WEL Windows Client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts
      - name: Test Electron helpers
        run: npm run test:electron
      - name: Check Windows PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem build -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "$($_.Name): $($errors -join '; ')"
            }
          }
          if ($failed) { throw 'Windows PowerShell 脚本语法检查失败' }
      - name: Build frontend
        run: npm run build
      - name: Check release runtime
        shell: pwsh
        run: |
          $required = @(
            'resources/openvpn/bin/openvpn.exe',
            'resources/openvpn/bin/libcrypto-1_1-x64.dll',
            'resources/openvpn/bin/libssl-1_1-x64.dll',
            'resources/openvpn/bin/libpkcs11-helper-1.dll',
            'resources/openvpn/bin/vcruntime140.dll',
            'resources/openvpn/bin/tapctl.exe',
            'resources/openvpn/ca.crt',
            'build/tap-windows-9.24.6/x64/OemVista.inf',
            'build/tap-windows-9.24.6/x64/tap0901.cat',
            'build/tap-windows-9.24.6/x64/tap0901.sys',
            'build/tap-windows-9.24.6/x64/tapinstall.exe'
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            throw "缺少安装包运行时文件，无法生成 Windows 安装包: $($missing -join ', ')"
          }
      - name: Build NSIS installer
        run: npx electron-builder --win nsis
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: wel-windows-win7-nsis
          path: frontend/release/WEL职业联盟对战平台-*-安装包.exe
          if-no-files-found: error
      - name: Prepare update files
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = Get-ChildItem release -Filter 'WEL职业联盟对战平台-*-安装包.exe' | Select-Object -First 1
          if ($null -eq $installer) {
            throw '没有找到 Windows 安装包'
          }
          $asciiName = "WEL-Platform-Setup-$version.exe"
          Copy-Item $installer.FullName "release/$asciiName" -Force
          $metadata = @{
            version = $version
            notes = "WEL职业联盟对战平台 v$version"
            githubUrl = "https://github.com/${{ github.repository }}/releases/download/windows-client-latest/$asciiName"
            serverUrl = "http://8.133.189.9/downloads/welopenvpn/$asciiName"
          } | ConvertTo-Json
          Set-Content -Path 'release/latest.json' -Value $metadata -Encoding utf8
      - name: Publish latest update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-client-latest
          name: WEL职业联盟对战平台最新版本
          body: 自动发布的 Windows 客户端更新包
          files: |
            frontend/release/WEL-Platform-Setup-*.exe
            frontend/release/latest.json
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
